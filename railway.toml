# ─────────────────────────────────────────────────────────────────────────────
# WAREOps API Gateway — Railway Config-as-Code
# ─────────────────────────────────────────────────────────────────────────────
#
# This file is picked up ONLY by the "api-gateway" service in Railway,
# whose Root Directory is set to "." (repo root) so the Dockerfile can
# access both infrastructure/nginx/ and apps/ops-dashboard/.
#
# Every other service has its own railway.toml in its own directory.
# ─────────────────────────────────────────────────────────────────────────────

[build]
builder = "DOCKERFILE"
dockerfilePath = "infrastructure/nginx/Dockerfile"
watchPatterns = [
  "infrastructure/nginx/**",
  "apps/ops-dashboard/src/**",
  "apps/ops-dashboard/package.json",
  "apps/ops-dashboard/vite.config.ts",
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
